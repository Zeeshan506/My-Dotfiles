# ==========================================
# FONTS & VISUALS
# ==========================================
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14

# Forces sharper text rendering on Wayland
text_composition_strategy legacy

# Make Neovim diagnostic undercurls look incredible
modify_font underline_position +2
modify_font underline_thickness 150%


# Window styling & padding
window_margin_width 0
window_padding_width 6
hide_window_decorations yes
confirm_os_window_close 0

# ==========================================
# WAYLAND PERFORMANCE
# ==========================================
linux_display_server wayland
repaint_delay 10
input_delay 3
sync_to_monitor yes
scrollback_lines 5000

# ==========================================
# CURSOR & BEHAVIOR
# ==========================================
cursor_shape block
cursor_blink true
cursor_blink_interval 0.3
cursor_trail 30 
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.2

# Silence the annoying terminal beep
enable_audio_bell no

copy_on_select yes
strip_trailing_spaces smart

# ==========================================
# SHELL INTEGRATION
# ==========================================
shell /usr/bin/zsh
shell_integration enabled
editor nvim

# ==========================================
# KEYBINDINGS: CORE NAVIGATION
# ==========================================
map ctrl+c        copy_or_interrupt
map ctrl+backspace send_text all \x17

# Cursor navigation for shell
map ctrl+left     send_text all \x1bb
map ctrl+right    send_text all \x1bf
map home          send_text all \x01
map end           send_text all \x05

# Scroll & Zoom
map page_up       scroll_page_up
map page_down     scroll_page_down

# Font Size Adjustment
map ctrl+plus         change_font_size all +1.0
map ctrl+equal        change_font_size all +1.0
map ctrl+kp_add       change_font_size all +1.0
map ctrl+minus        change_font_size all -1.0
map ctrl+underscore   change_font_size all -1.0
map ctrl+kp_subtract  change_font_size all -1.0
map ctrl+0            change_font_size all 0
map ctrl+kp_0         change_font_size all 0

# ==========================================
# KEYBINDINGS: WINDOWS & MULTIPLEXING
# ==========================================
# Tabbing
map ctrl+t new_tab
tab_bar_style powerline
tab_bar_align left

# Window creation & splits
map ctrl+shift+n     new_window
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+alt+h launch --location=hsplit
map ctrl+shift+alt+v launch --location=vsplit
map ctrl+shift+w     close_window
# Change the layout (stack, grid, tall, etc.)
map ctrl+shift+l     next_layout

# ==========================================
# KEYBINDINGS: KITTENS (PLUGINS)
# ==========================================
# Open URLs clicked or hinted in the terminal
map ctrl+shift+e kitten hints

# Select a path/filename and insert it into the command line
map ctrl+shift+p kitten hints --type path --program -

# Broadcast keystrokes to all open Kitty windows
map ctrl+shift+f5 kitten broadcast

# ==========================================
# DANK MONO SHELL THEME INCLUDES
# ==========================================

# ──────────────────────────────
#   COLORS — Koda Palette Dark Monochrome
# ──────────────────────────────

foreground            #a6a6a6
background            #080808
background_opacity    0.98

selection_foreground  #c4c4c4
selection_background  #1a1a1a

cursor                #c4c4c4
cursor_text_color     #080808

url_color             #8a8a8a
active_border_color   #1a1a1a
inactive_border_color #121212

