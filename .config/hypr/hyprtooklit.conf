# Deepest background (matches Waybar base)
background = 0xFF050505

# Module background / Input fields
base = 0xFF121212

# Hover states / Selections
alternate_base = 0xFF1E1E1E

# Standard text
text = 0xFF8A8A8A

# Bright / Active text
bright_text = 0xFFFFFFFF

# Highlights
accent = 0xFFD0D0D0
accent_secondary = 0xFF555555

# Typography
font_family = JetBrains Mono
font_family_monospace = JetBrains Mono
font_size = 13
h1_size = 18
h2_size = 16
h3_size = 14
small_font_size = 11

# Strip all rounding for the sharp, minimal aesthetic
rounding_large = 0
rounding_small = 0
