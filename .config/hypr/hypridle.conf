general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # Lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn screen on after waking up.
}

# 1. Dim the screen after 2.5 minutes
listener {
    timeout = 150                                
    on-timeout = brightnessctl -s set 10         # Set monitor backlight to minimum.
    on-resume = brightnessctl -r                 # Restore monitor backlight.
}

# 2. Lock the screen after 3 minutes
listener {
    timeout = 180                                 
    on-timeout = loginctl lock-session            
}

# 3. Turn off the screen after 5.5 minutes
listener {
    timeout = 330                                 
    on-timeout = hyprctl dispatch dpms off        
    on-resume = hyprctl dispatch dpms on          
}

# 4. Suspend the laptop after 10 minutes
listener {
    timeout = 600                                 
    on-timeout = systemctl suspend                
}
