# ~/.config/hypr/hyprland.conf

$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun 

monitor=,preferred,auto,1.0

# Environment
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = NIXOS_OZONE_WL,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Startup
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar -c /home/zeshan6a/.config/waybar/config-hyprland
exec-once = swaync
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = udiskie --tray
exec-once = awww-daemon
exec-once = awww img ~/Wallpapers/wallhaven-21d6g9_1920x1080.png
exec-once = hypridle
exec-once = ~/.config/waybar/watch.sh
exec-once = xfce4-power-manager
exec-once = hpyrpm enable gloview

# Input
input {
    kb_layout = us
    follow_mouse = 1
    repeat_rate = 30
    repeat_delay = 350
    numlock_by_default = true
    

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }

    sensitivity = 0
}

# General look
general {
    gaps_in = 4
    gaps_out = 4
    border_size = 1 
    layout = scrolling
    col.active_border = rgba(d0d0d0ff)
    col.inactive_border = rgba(202020ff)
}

# Scrolling layout: each new window gets an independent full-width column.
# Existing columns keep their widths when another window is opened.
scrolling {
    column_width = 1.0
    fullscreen_on_one_column = true
}

decoration {
    rounding = 0

    blur {
        enabled = true
        size = 4
        passes = 2
    }

    shadow {
        enabled = false
        range = 12
        render_power = 3
    }
}

animations {
    enabled = true

    bezier = smooth, 0.25, 0.9, 0.25, 1.0

    animation = windows, 1, 4, smooth
    animation = windowsOut, 1, 4, smooth
    animation = border, 1, 6, default
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, smooth
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# Main binds
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, exec, $menu
bind = $mainMod, V, togglefloating
bind = $mainMod, F, layoutmsg, fit expand
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, L, exec, hyprlock
# Screenshots: save captures and copy them to the clipboard
# Region screenshot with a 2-second delay to open dropdowns
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o ~/Pictures/Screenshots --freeze
# Window screenshot with a 2-second delay
bind = $mainMod SHIFT, W, exec,  hyprshot -m window -o ~/Pictures/Screenshots
# Output (full screen) screenshot with a 2-second delay
bind = $mainMod SHIFT, O, exec, hyprshot -m output -o ~/Pictures/Screenshots 
bind = $mainMod, T, exec, waypaper
bind = $mainMod, X, exec, ~/.config/waybar/power_menu-hyprland.sh

# Clipboard manager (Moved to SHIFT+C to free up Mod+C for scrolling layout centering)
bind = $mainMod SHIFT, C, exec, cliphist list | hyprlauncher --dmenu | cliphist decode | wl-copy

# ==========================================
# SCROLLING LAYOUT CONTROLS & RESIZING
# ==========================================

# Move focus between scrolling columns/windows
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move columns/windows inside the layout track
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

# Center current column/window into view
bind = $mainMod, C, layoutmsg, fit_into_view

# Resize column widths (Relative factor of screen size)
binde = $mainMod SHIFT, right, layoutmsg, colresize +0.05
binde = $mainMod SHIFT, left, layoutmsg, colresize -0.05

# Alternatively, cycle through your preconfigured widths (e.g., 0.33, 0.5, 0.66)
# binde = $mainMod SHIFT, right, layoutmsg, colresize +conf
# binde = $mainMod SHIFT, left, layoutmsg, colresize -conf

# Fallback window resize (Only useful for floating windows)
binde = $mainMod ALT, right, resizeactive, 30 0
binde = $mainMod ALT, left, resizeactive, -30 0
binde = $mainMod ALT, up, resizeactive, 0 -30
binde = $mainMod ALT, down, resizeactive, 0 30
# Mouse Move + Resize



bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, mouse:272, movewindow


# ==========================================
# WORKSPACE MOVEMENT BINDINGS
# ==========================================

# Navigate workspaces using the keyboard
bind = $mainMod, Page_Down, workspace, m+1
bind = $mainMod, Page_Up, workspace, m-1

# Scroll through existing workspaces with mainMod + mouse wheel
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move the active window to the next/previous workspace
bind = $mainMod SHIFT, Page_Down, movetoworkspace, m+1
bind = $mainMod SHIFT, Page_Up, movetoworkspace, m-1


# ==========================================
# QUALITY OF LIFE (QOL) ADDITIONS
# ==========================================

# Center Floating Window (Standard floating windows only)
bind = $mainMod, K, centerwindow

# Pin Window: Pins a floating window to the screen so it follows you across workspaces
bind = $mainMod, P, pin

# Special Workspace (Scratchpad)
bind = $mainMod, Z, togglespecialworkspace, magic
bind = $mainMod SHIFT, Z, movetoworkspace, special:magic

# Gloview
bind = $mainMod, Tab, gloview:toggle
bind = $mainMod SHIFT, Tab, gloview:desktop
bind = $mainMod CTRL, Tab, gloview:allworkspaces
bind = $mainMod, bracketright, gloview:next
bind = $mainMod, bracketleft, gloview:prev

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 9, gloview:setworkspace, 9
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Laptop/media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
