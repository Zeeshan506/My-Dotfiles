# Niri-compatible replacement for hypridle.
# Matches timings and locks securely before sleep.

lock "swaylock -f"
before-sleep "loginctl lock-session"
after-resume "niri msg action power-on-monitors"

timeout 150 "brightnessctl -s set 10" resume "brightnessctl -r"
timeout 180 "loginctl lock-session"
timeout 330 "niri msg action power-off-monitors" resume "niri msg action power-on-monitors"
timeout 600 "systemctl suspend"
